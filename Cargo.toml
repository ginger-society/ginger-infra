[package]
description = "Infra related commands"
edition = "2021"
name = "ginger-infra"
version = "0.6.0-nightly.0"
default-run = "ginger-infra"

[[bin]]
name = "remote-task-controller"
path = "src/bin/remote-task-controller/main.rs"

[[bin]]
name = "restic-snapshot-controller"
path = "src/bin/restic-snapshot-controller/main.rs"

[package.metadata]
organization = "ginger-society"

[dependencies]
IAMService = {path = "./IAMService_client"}
MetadataService = {path = "./MetadataService_client"}
GingerPresence = { path = "./GingerPresence_client" }
GingerBucket = { path = "./GingerBucket_client" }
clap = {version = "4.5.7", features = ["derive", "env"]}
colored = {version = "2.0.1"}
ginger-shared-rs = {version = "0.50.0-nightly.0", organization = "ginger-society"}
tokio = {version = "1", features = ["full"]}
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.31"
serde = {version = "1.0.166", features = ["derive"]}
serde_json = {version = "1.0.100"}
sysinfo = "0.31"
walkdir = "2"
tera = "1"
anyhow = "1"
regex = "1.12.3"
base64 = "0.22"
toml = "0.8"
libc = "0.2.186"
reqwest = { version = "^0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
kube = { version = "3.1.0", features = ["runtime", "derive", "client", "ws", "rustls-tls"] }
k8s-openapi = { version = "0.27.0", features = ["latest", "schemars"] }
schemars = { version = "1" }
serde_yaml = "0.9"
thiserror = "1"
tokio-cron-scheduler = "0.10"
chrono = "0.4"
indicatif = "0.17"
urlencoding = "2"
clap_lex = "=0.7.0"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
prometheus = "0.13"
once_cell = "1"