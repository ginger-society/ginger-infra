[package]
description = "Infra related commands"
edition = "2021"
name = "ginger-infra"
version = "0.6.0-nightly.0"
default-run = "ginger-infra"

[[bin]]
name = "remote-task-controller"
path = "src/bin/tekton-controller.rs"

[package.metadata]
organization = "ginger-society"

[dependencies]
IAMService = {path = "./IAMService_client"}
MetadataService = {path = "./MetadataService_client"}
GingerPresence = { path = "./GingerPresence_client" }
clap = {version = "4.5.7", features = ["derive"]}
colored = {version = "2.0.1"}
ginger-shared-rs = {version = "0.50.0-nightly.0", organization = "ginger-society"}
tokio = {version = "1", features = ["full"]}
tokio-tungstenite = { version = "0.26.2", features = ["tokio-native-tls", "native-tls"] }
futures-util = "0.3.31"
serde = {version = "1.0.166", features = ["derive"]}
serde_json = {version = "1.0.100"}
sysinfo = "0.30"
walkdir = "2"
tera = "1"
anyhow = "1"
regex = "1.12.3"
base64 = "0.22"
toml = "0.8"
libc = "0.2.186"
reqwest = { version = "0.12", features = ["json", "stream"] }
kube = { version = "3.1.0", features = ["runtime", "derive", "client", "ws"] }
k8s-openapi = { version = "0.27.0", features = ["latest", "schemars"] }
schemars = { version = "1" }
serde_yaml = "0.9"      # for rendering the generated CRD struct to YAML
thiserror = "1"         # for the controller's ReconcileError enum
chrono = "0.4"          # for RemoteTaskStatus timestamps (k8s_openapi::Time wraps chrono::DateTime<Utc>)
